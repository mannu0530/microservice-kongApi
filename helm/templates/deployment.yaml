apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-user-microservice
  labels:
    app: user-microservice
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    release: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: user-microservice
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: user-microservice
        release: {{ .Release.Name }}
    spec:
      containers:
      - name: user-microservice
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.service.containerPort }}
          name: http
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
        env:
        - name: DATABASE_URL
          value: "{{ .Values.env.databaseUrl }}"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-user-microservice-secret
              key: jwt-secret
        - name: ADMIN_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-user-microservice-secret
              key: admin-username
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-user-microservice-secret
              key: admin-password
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
