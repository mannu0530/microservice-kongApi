apiVersion: v1
kind: Secret
metadata:
  name: kong-jwt-secret
  namespace: default
type: Opaque
stringData:
  # JWT secret key used to sign tokens (base64 encoded)
  # This should match the secret in kong.yaml
  jwt-secret: cGxlYXNlLXRoaXMtcmVwbGFjZS13aXRoLXNlY3VyZS1rZXk=
---
# KongConsumer for JWT authentication
apiVersion: configuration.konghq.com/v1
kind: KongConsumer
metadata:
  name: api-consumer
  namespace: default
username: api-consumer
credentials:
  - jwt-credential
---
# JWT Credential
apiVersion: configuration.konghq.com/v1
kind: KongCredential
metadata:
  name: jwt-credential
  namespace: default
  consumerRef: api-consumer
type: jwt
config:
  key: "user-api-key"
  algorithm: "HS256"
  # Base64 encoded secret - replace with actual secret
  secret: "cGxlYXNlLXRoaXMtcmVwbGFjZS13aXRoLXNlY3VyZS1rZXk="
