_format_version: "3.0"
services:
  - name: user-microservice
    url: http://user-microservice-user-microservice.user-ms.svc.cluster.local:80
    plugins:
      - name: rate-limiting
        config:
          minute: 5
          policy: local
          fault_tolerant: true
    routes:
      - name: user-ms-health
        paths:
          - /health
        strip_path: false
      - name: user-ms-login
        paths:
          - /login
        strip_path: false
      - name: user-ms-verify
        paths:
          - /verify
        strip_path: false
      - name: user-ms-users
        paths:
          - /users
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 10
              policy: local
              fault_tolerant: true
